# Render Blueprint — deploy with: https://dashboard.render.com/new?type=blueprint
#
# Creates three resources:
#   1. Web service  (Django + Gunicorn)
#   2. PostgreSQL   (managed database)
#   3. Cron Job     (daily document fetch at 02:00 UTC)
#
# After the first deploy, create a superuser via Render Shell:
#   python manage.py createsuperuser

services:
  - type: web
    name: tosdiff
    runtime: docker
    repo: https://github.com/geekygirlsarah/tos-diff.git
    branch: main
    plan: starter
    region: ohio
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false  # set/update on the service in the Render dashboard
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: tosdiff.onrender.com  # ← update after deploy
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tosdiff-db
          property: connectionString
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
  - type: cron
    name: fetch-documents
    runtime: docker
    repo: https://github.com/geekygirlsarah/tos-diff.git
    branch: main
    plan: starter
    region: ohio
    schedule: "0 2 * * *"  # 02:00 UTC daily
    dockerCommand: manage fetch_documents
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false  # set/update on the service in the Render dashboard
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tosdiff-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

databases:
  - name: tosdiff-db
    plan: free
    region: ohio
    databaseName: tosdiff
    user: tosdiff