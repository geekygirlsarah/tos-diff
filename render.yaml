# Render Blueprint — deploy with: https://dashboard.render.com/new?type=blueprint
#
# Creates three resources:
#   1. Web service  (Django + Gunicorn)
#   2. PostgreSQL   (managed database)
#   3. Cron Job     (daily document fetch at 02:00 UTC)
#
# After the first deploy, create a superuser via Render Shell:
#   python manage.py createsuperuser

services:
  - type: web
    name: tosdiff
    runtime: docker
    repo: https://github.com/geekygirlsarah/tos-diff.git
    branch: main
    plan: free
    region: ohio
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false  # set/update on the service in the Render dashboard
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: tosdiff.onrender.com,tosdiff.org
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tosdiff-db
          property: connectionString
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MAILGUN_API_KEY
        sync: false  # transactional mail (login codes, change digests) via Mailgun
      - key: MAILGUN_DOMAIN
        sync: false  # sending domain, e.g. mg.tosdiff.org
      - key: BASE_URL
        value: https://tosdiff.org  # public site root used for links in emails
      - key: WEEKLY_DIGEST_WEEKDAY
        value: "1"  # weekly digests go out on the fetch-cron day for ISO weekday 1 (Monday)
  - type: cron
    name: fetch-documents
    runtime: docker
    repo: https://github.com/geekygirlsarah/tos-diff.git
    branch: main
    plan: 1c-2g
    region: ohio
    # Fetches every document, queues change notifications for subscribers, sends
    # the daily digests, and sends the weekly digests on the WEEKLY_DIGEST_WEEKDAY.
    schedule: "15 8 * * *"  # 08:15 UTC daily (00:15 PST/01:15 PDT, 03:15 EST/04:15 EDT)
    dockerCommand: python manage.py fetch_documents
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false  # set/update on the service in the Render dashboard
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tosdiff-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: BASE_URL
        value: https://tosdiff.org
      - key: MAILGUN_API_KEY
        sync: false  # transactional mail (login codes, change digests) via Mailgun
      - key: MAILGUN_DOMAIN
        sync: false  # sending domain, e.g. mg.tosdiff.org
      - key: DEFAULT_FROM_EMAIL
        sync: false  # must use a sender on MAILGUN_DOMAIN so Mailgun accepts it
      - key: WEEKLY_DIGEST_WEEKDAY
        value: "1"  # weekly digests go out on this ISO weekday (1=Monday)

databases:
  - name: tosdiff-db
    plan: free
    region: ohio
    databaseName: tosdiff
    user: tosdiff