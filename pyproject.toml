[project]
name = "tosdiff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "playwright>=1.40",
    "whitenoise>=6.6",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "manage.py",
    "tosdiff/wsgi.py",
    "tosdiff/asgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

# Test/lint tooling.  Kept in a single PEP 735 dependency group (not split
# between an extra and a group) so `uv sync --all-groups` picks up everything
# CI needs and `uv sync --no-dev` excludes all of it.  These are deliberately
# NOT runtime dependencies, so they never reach the production image.
[dependency-groups]
dev = [
    "coverage>=7.0",
    "ruff>=0.16.6",
]
